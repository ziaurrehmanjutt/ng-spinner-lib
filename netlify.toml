[build]
  command = "npm ci && npx ng build ng-spinner-wheel && npx ng build demo"
  publish = "dist/demo/browser"

[build.environment]
  NODE_VERSION = "24"
  # Netlify's Angular plugin otherwise picks the first project (the library)
  ANGULAR_PROJECT = "demo"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
